<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Cache-busting meta tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Primary Meta Tags -->
  <title>Manjith Hemachandran — Flutter Mobile Application Developer</title>
  <meta name="title" content="Manjith Hemachandran — Flutter Mobile Application Developer">
  <meta name="description" content="Portfolio of Manjith Hemachandran, Flutter Mobile Application Developer with 2.5+ years of software development experience and 17+ production apps deployed across Google Play Store &amp; Apple App Store. Specializing in Clean Architecture, Payment Integrations, Google Maps, and Shorebird OTA updates.">
  <meta name="keywords" content="Manjith Hemachandran, Flutter Developer, Mobile Application Developer, Android, iOS, Clean Architecture, Shorebird, Dart, Flutter Web">
  <meta name="author" content="Manjith Hemachandran">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Manjith Hemachandran — Flutter Mobile Application Developer">
  <meta property="og:description" content="2.5+ years experience, 17+ production applications, Android &amp; iOS, Clean Architecture, Payment Integrations &amp; Shorebird OTA updates.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Manjith Hemachandran">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0A0F;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0A0A0F;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    .monogram-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      margin-bottom: 1.2rem;
    }
    .monogram-text {
      background: linear-gradient(135deg, #FFFFFF 0%, #C8CDD5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .monogram-slash {
      color: #E63946;
      -webkit-text-fill-color: #E63946;
      font-weight: 300;
      opacity: 0.9;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(230, 57, 70, 0.15);
      border-top: 3px solid #E63946;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="monogram-badge">
      <span class="monogram-text">MH</span>
      <span class="monogram-slash">//</span>
    </div>
    <div class="spinner"></div>
  </div>
  <script>
    // Unregister any stale service workers to prevent caching issues
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.unregister();
        }
      });
    }
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
